<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>デブリにゃんこ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--bg:#0b0b2a;--ink:#fcfcfc;--dim:#9aa0c8;--warn:#f8b800;--danger:#e40058;--btn:#e8202a;--btn-dk:#8a0a10;--black:#101018;
  --pix:"DotGothic16","MS Gothic","Osaka-Mono",monospace;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--pix)}
body{display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 60%,#a4e4fc 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#fce0a8 50%,transparent 51%);background-size:90px 90px,130px 130px,70px 70px}
form{background:var(--black);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--black),0 0 0 6px #2a2a5a;padding:20px 18px;width:100%;max-width:340px;
  display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
h1{margin:0;text-align:center;font-weight:normal;font-size:32px;line-height:1.05;color:var(--warn);text-shadow:3px 3px 0 var(--danger),6px 6px 0 var(--black)}
p{margin:0;font-size:13px;line-height:1.6;text-align:center}
label{font-size:12px;color:var(--dim)}
input{font:inherit;font-size:18px;padding:8px 10px;background:#1c1c44;color:var(--ink);border:2px solid var(--ink);border-radius:0;width:100%;box-sizing:border-box}
input:focus{outline:3px solid var(--warn);outline-offset:1px}
button{font:inherit;font-size:18px;align-self:center;background:var(--btn);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--btn-dk);padding:8px 28px;cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--btn-dk)}
button:disabled{opacity:.6}
#msg{min-height:1.4em;color:var(--danger);font-size:13px;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="off">

  <label for="pw">パスワード</label>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <div id="msg" role="alert"></div>
  <button id="go" type="submit">▶ はいる</button>
</form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(DATA.iv)},key,u8(DATA.ct)));
  try{sessionStorage.setItem('dn-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('go'),m=document.getElementById('msg');
  b.disabled=true;m.textContent='';
  try{await unlock(document.getElementById('pw').value)}
  catch(err){m.textContent='パスワードがちがいます';b.disabled=false}
});
(async()=>{let pw=null;try{pw=sessionStorage.getItem('dn-pw')}catch(e){}
  if(pw){try{await unlock(pw)}catch(e){try{sessionStorage.removeItem('dn-pw')}catch(_){}}}})();
</script>
